openapi: 3.0.0
info:
  title: 'Order and Payment Management API'
  description: 'Authenticate with a JWT bearer token. API errors use message/code and validation errors include errors. Limits are configurable; 429 includes Retry-After. Payment creation requires Idempotency-Key; replays count toward rate limits. Gateways are deterministic simulations.'
  version: 0.5.0
servers:
  -
    url: /
    description: 'Current server'
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: 'Register a user'
      description: 'Email is trimmed and normalized to lowercase. Returns the user; log in separately to obtain a JWT.'
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterUser:
                value:
                  name: 'Jane Doe'
                  email: jane@example.com
                  password: StrongPass123!
                  password_confirmation: StrongPass123!
      responses:
        201:
          description: 'User created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                Registered:
                  value:
                    data:
                      id: 1
                      name: 'Jane Doe'
                      email: jane@example.com
                      created_at: '2026-10-21T00:00:00.000000Z'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: 'Log in and obtain a JWT'
      description: 'Limited by normalized email and IP address. expires_in is seconds. Send access_token as Authorization: Bearer <token>.'
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login:
                value:
                  email: jane@example.com
                  password: StrongPass123!
      responses:
        200:
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Authenticated:
                  value:
                    data:
                      access_token: eyJ...example-jwt
                      token_type: bearer
                      expires_in: 3600
                      user:
                        id: 1
                        name: 'Jane Doe'
                        email: jane@example.com
                        created_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: 'Get the current user'
      operationId: currentUser
      responses:
        200:
          description: 'Current user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                CurrentUser:
                  value:
                    data:
                      id: 1
                      name: 'Jane Doe'
                      email: jane@example.com
                      created_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Invalidate the current JWT'
      description: 'The token is blacklisted until its expiry. Returns an empty response.'
      operationId: logout
      responses:
        204:
          description: 'Token invalidated; no response body.'
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  '/api/orders/{order}/ledger':
    get:
      tags:
        - Ledger
      summary: 'Read an order financial history'
      description: 'Owner-scoped and read-only. Entries are ordered by chain_sequence. Credits add to balance, debits subtract, memos have no balance effect.'
      operationId: orderLedger
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
      responses:
        200:
          description: 'Paginated immutable ledger entries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
              examples:
                OrderHistory:
                  value:
                    data:
                      -
                        id: 01J00000000000000000000000
                        order_id: 1
                        payment_id: null
                        chain_sequence: 1
                        type: payment_initiated
                        direction: memo
                        amount: '39.98'
                        currency: USD
                        gateway: credit_card
                        transaction_id: null
                        idempotency_key: payment-request-001
                        metadata:
                          last4: '4242'
                        previous_hash: null
                        entry_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                        created_at: '2026-10-21T00:00:00.000000Z'
                    links:
                      first: '/api/orders/1/ledger?page=1'
                      last: '/api/orders/1/ledger?page=1'
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      last_page: 1
                      per_page: 15
                      total: 1
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  '/api/payments/{payment}/ledger':
    get:
      tags:
        - Ledger
      summary: 'Read a payment financial history'
      description: 'Read-only, owner-scoped payment events in chain order. Another user receives 404.'
      operationId: paymentLedger
      parameters:
        -
          $ref: '#/components/parameters/PaymentId'
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
      responses:
        200:
          description: 'Paginated immutable payment events.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  /api/orders:
    get:
      tags:
        - Orders
      summary: 'List and filter your orders'
      description: 'Owner-scoped, newest first. per_page defaults to 15 and has a maximum of 100.'
      operationId: listOrders
      parameters:
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - cancelled
      responses:
        200:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                listOrders:
                  value:
                    data:
                      -
                        id: 1
                        user_id: 1
                        customer_name: 'Jane Doe'
                        customer_email: jane@example.com
                        status: pending
                        total_amount: '39.98'
                        items:
                          -
                            id: 1
                            product_name: Book
                            quantity: 2
                            price: '19.99'
                        created_at: '2026-10-21T00:00:00.000000Z'
                        updated_at: '2026-10-21T00:00:00.000000Z'
                    links:
                      first: '/api/orders?page=1'
                      last: '/api/orders?page=1'
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      last_page: 1
                      per_page: 15
                      total: 1
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Orders
      summary: 'Place an order'
      description: 'Totals and initial pending status are computed by the aggregate. Client total_amount, status, and user_id fields are ignored.'
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            examples:
              CreateOrder:
                value:
                  customer_name: 'Jane Doe'
                  customer_email: jane@example.com
                  items:
                    -
                      product_name: Book
                      quantity: 2
                      price: '19.99'
      responses:
        201:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                createOrder:
                  value:
                    data:
                      id: 1
                      user_id: 1
                      customer_name: 'Jane Doe'
                      customer_email: jane@example.com
                      status: pending
                      total_amount: '39.98'
                      items:
                        -
                          id: 1
                          product_name: Book
                          quantity: 2
                          price: '19.99'
                      created_at: '2026-10-21T00:00:00.000000Z'
                      updated_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  '/api/orders/{order}':
    get:
      tags:
        - Orders
      summary: 'Get an order'
      description: 'Other users receive 404, matching missing resources.'
      operationId: showOrder
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
      responses:
        200:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                showOrder:
                  value:
                    data:
                      id: 1
                      user_id: 1
                      customer_name: 'Jane Doe'
                      customer_email: jane@example.com
                      status: pending
                      total_amount: '39.98'
                      items:
                        -
                          id: 1
                          product_name: Book
                          quantity: 2
                          price: '19.99'
                      created_at: '2026-10-21T00:00:00.000000Z'
                      updated_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Orders
      summary: 'Update order details or items'
      description: 'Only pending orders are editable. Provided items replace the entire item collection; omitted fields remain unchanged.'
      operationId: replaceOrder
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
            examples:
              UpdateOrder:
                value:
                  customer_name: 'Jane Doe'
                  customer_email: jane@example.com
                  items:
                    -
                      product_name: Book
                      quantity: 2
                      price: '19.99'
      responses:
        200:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                replaceOrder:
                  value:
                    data:
                      id: 1
                      user_id: 1
                      customer_name: 'Jane Doe'
                      customer_email: jane@example.com
                      status: pending
                      total_amount: '39.98'
                      items:
                        -
                          id: 1
                          product_name: Book
                          quantity: 2
                          price: '19.99'
                      created_at: '2026-10-21T00:00:00.000000Z'
                      updated_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
        409:
          description: 'Domain state conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderHasPayments:
                  value:
                    message: 'An order with payments cannot be deleted.'
                    code: ORDER_HAS_PAYMENTS
                InvalidTransition:
                  value:
                    message: 'Cannot change order status from cancelled to confirmed.'
                    code: INVALID_STATUS_TRANSITION
                OrderNotEditable:
                  value:
                    message: 'Only pending orders are editable.'
                    code: ORDER_NOT_EDITABLE
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Orders
      summary: 'Delete an order without payments'
      description: 'Any existing payment, including failed attempts, blocks deletion. Until Payments is implemented, a temporary no-payments guard is bound.'
      operationId: deleteOrder
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
      responses:
        204:
          description: 'Order and its items deleted; no response body.'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
        409:
          description: 'Domain state conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderHasPayments:
                  value:
                    message: 'An order with payments cannot be deleted.'
                    code: ORDER_HAS_PAYMENTS
                InvalidTransition:
                  value:
                    message: 'Cannot change order status from cancelled to confirmed.'
                    code: INVALID_STATUS_TRANSITION
                OrderNotEditable:
                  value:
                    message: 'Only pending orders are editable.'
                    code: ORDER_NOT_EDITABLE
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Orders
      summary: 'Partially update an order'
      description: 'Only pending orders are editable. Provided items replace the complete item collection.'
      operationId: updateOrder
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
            examples:
              UpdateOrder:
                value:
                  customer_name: 'Jane Doe'
                  customer_email: jane@example.com
                  items:
                    -
                      product_name: Book
                      quantity: 2
                      price: '19.99'
      responses:
        200:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                updateOrder:
                  value:
                    data:
                      id: 1
                      user_id: 1
                      customer_name: 'Jane Doe'
                      customer_email: jane@example.com
                      status: pending
                      total_amount: '39.98'
                      items:
                        -
                          id: 1
                          product_name: Book
                          quantity: 2
                          price: '19.99'
                      created_at: '2026-10-21T00:00:00.000000Z'
                      updated_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
        409:
          description: 'Domain state conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderHasPayments:
                  value:
                    message: 'An order with payments cannot be deleted.'
                    code: ORDER_HAS_PAYMENTS
                InvalidTransition:
                  value:
                    message: 'Cannot change order status from cancelled to confirmed.'
                    code: INVALID_STATUS_TRANSITION
                OrderNotEditable:
                  value:
                    message: 'Only pending orders are editable.'
                    code: ORDER_NOT_EDITABLE
      security:
        -
          bearerAuth: []
  '/api/orders/{order}/status':
    patch:
      tags:
        - Orders
      summary: 'Confirm or cancel an order'
      description: 'Allowed transitions: pending to confirmed/cancelled; confirmed to cancelled only without successful or pending payments. Cancelled is terminal.'
      operationId: changeOrderStatus
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - confirmed
                    - cancelled
              type: object
            examples:
              ConfirmOrder:
                value:
                  status: confirmed
              CancelOrder:
                value:
                  status: cancelled
      responses:
        200:
          description: 'Successful order response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                changeOrderStatus:
                  value:
                    data:
                      id: 1
                      user_id: 1
                      customer_name: 'Jane Doe'
                      customer_email: jane@example.com
                      status: confirmed
                      total_amount: '39.98'
                      items:
                        -
                          id: 1
                          product_name: Book
                          quantity: 2
                          price: '19.99'
                      created_at: '2026-10-21T00:00:00.000000Z'
                      updated_at: '2026-10-21T00:00:00.000000Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
        409:
          description: 'Domain state conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderHasPayments:
                  value:
                    message: 'An order with payments cannot be deleted.'
                    code: ORDER_HAS_PAYMENTS
                InvalidTransition:
                  value:
                    message: 'Cannot change order status from cancelled to confirmed.'
                    code: INVALID_STATUS_TRANSITION
                OrderNotEditable:
                  value:
                    message: 'Only pending orders are editable.'
                    code: ORDER_NOT_EDITABLE
      security:
        -
          bearerAuth: []
  '/api/orders/{order}/payments':
    get:
      tags:
        - Payments
      summary: 'List an order payment attempts'
      description: 'Owner-scoped, newest first, including failed attempts. Another user receives 404.'
      operationId: listOrderPayments
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          $ref: '#/components/parameters/PaymentStatusFilter'
        -
          $ref: '#/components/parameters/PaymentMethodFilter'
      responses:
        200:
          description: 'Paginated payment attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Payments
      summary: 'Pay a confirmed order'
      description: 'Simulated charges: card ending 0002 declines, 0003 raises a provider error; PayPal fail@ declines, error@ raises a provider error. Successful and failed attempts return 201. Authentication runs before the per-user and per-order limits, followed by idempotency. Replays count toward both limits. An existing pending attempt is returned without another charge for the same key; a different key receives PAYMENT_IN_PROGRESS. Pending recovery requires operator reconciliation. The domain key/fingerprint remains effective after the 24-hour replay cache expires.'
      operationId: processPayment
      parameters:
        -
          $ref: '#/components/parameters/OrderId'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPayment'
            examples:
              CreditCard:
                value:
                  method: credit_card
                  payment_details:
                    card_number: '4242424242424242'
                    expiry_month: 12
                    expiry_year: 2030
                    cvv: '123'
                    card_holder: 'Jane Doe'
              PayPal:
                value:
                  method: paypal
                  payment_details:
                    email: payer@example.com
              DeclinedCard:
                value:
                  method: credit_card
                  payment_details:
                    card_number: '4000000000000002'
                    expiry_month: 12
                    expiry_year: 2030
                    cvv: '123'
                    card_holder: 'Jane Doe'
      responses:
        201:
          description: 'Persisted payment attempt (including failed payments). Replay returns identical status/body and Idempotent-Replayed: true. No provider internals are exposed.'
          headers:
            Idempotent-Replayed:
              description: 'Present with value true on a cached replay.'
              schema:
                type: string
                example: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                SuccessfulPayment:
                  value:
                    data:
                      id: 1
                      order_id: 1
                      user_id: 1
                      status: successful
                      method: credit_card
                      amount: '39.98'
                      currency: USD
                      transaction_id: cc_example
                      failure_code: null
                      created_at: '2026-10-21T00:00:00Z'
                      updated_at: '2026-10-21T00:00:00Z'
                FailedPayment:
                  value:
                    data:
                      id: 2
                      order_id: 1
                      user_id: 1
                      status: failed
                      method: credit_card
                      amount: '39.98'
                      currency: USD
                      transaction_id: null
                      failure_code: CARD_DECLINED
                      created_at: '2026-10-21T00:00:00Z'
                      updated_at: '2026-10-21T00:00:00Z'
                IdempotentReplay:
                  summary: 'Same response as the first successful request; replay header is true.'
                  value:
                    data:
                      id: 1
                      order_id: 1
                      user_id: 1
                      status: successful
                      method: credit_card
                      amount: '39.98'
                      currency: USD
                      transaction_id: cc_example
                      failure_code: null
                      created_at: '2026-10-21T00:00:00Z'
                      updated_at: '2026-10-21T00:00:00Z'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'Order or request conflict.'
          headers:
            Retry-After:
              description: 'One second for an in-progress request/payment.'
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderNotConfirmed:
                  value:
                    message: 'Only confirmed orders can be paid.'
                    code: ORDER_NOT_CONFIRMED
                OrderAlreadyPaid:
                  value:
                    message: 'This order already has a successful payment.'
                    code: ORDER_ALREADY_PAID
                IdempotencyInProgress:
                  value:
                    message: 'A request with this key is still processing.'
                    code: IDEMPOTENCY_IN_PROGRESS
                PaymentInProgress:
                  value:
                    message: 'This order has a pending payment.'
                    code: PAYMENT_IN_PROGRESS
        422:
          description: 'Invalid input or idempotency key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    message: 'The given data was invalid.'
                    code: VALIDATION_ERROR
                    errors:
                      payment_details.cvv:
                        - 'The CVV must contain 3 or 4 digits.'
                KeyRequired:
                  value:
                    message: 'The Idempotency-Key header is required.'
                    code: IDEMPOTENCY_KEY_REQUIRED
                KeyReused:
                  value:
                    message: 'This key was already used for a different request.'
                    code: IDEMPOTENCY_KEY_REUSED
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  /api/payments:
    get:
      tags:
        - Payments
      summary: 'List and filter your payments'
      description: 'Owner-scoped, newest first. Filters combine status, historical method, and order_id. No provider internals are exposed.'
      operationId: listPayments
      parameters:
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          $ref: '#/components/parameters/PaymentStatusFilter'
        -
          $ref: '#/components/parameters/PaymentMethodFilter'
        -
          name: order_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Paginated payment attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  '/api/payments/{payment}':
    get:
      tags:
        - Payments
      summary: 'Get a payment attempt'
      operationId: showPayment
      parameters:
        -
          $ref: '#/components/parameters/PaymentId'
      responses:
        200:
          description: 'Payment details without raw provider data.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security:
        -
          bearerAuth: []
  /api/documentation:
    get:
      tags:
        - Documentation
      summary: 'Open Swagger UI'
      description: 'Public when API_DOCUMENTATION_ENABLED is true. Disabled in production by default. Documentation assets and spec downloads use the same flag and IP rate limiter.'
      operationId: documentation
      responses:
        200:
          description: 'Swagger UI.'
          content:
            text/html:
              schema:
                type: string
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
      security: []
components:
  schemas:
    User:
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Jane Doe'
        email:
          type: string
          format: email
          example: jane@example.com
        created_at:
          type: string
          format: date-time
          example: '2026-10-21T00:00:00.000000Z'
          nullable: true
      type: object
    UserResponse:
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
      type: object
    TokenResponse:
      required:
        - data
      properties:
        data:
          required:
            - access_token
            - token_type
            - expires_in
            - user
          properties:
            access_token:
              type: string
              example: eyJ...example-jwt
            token_type:
              type: string
              example: bearer
            expires_in:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'
          type: object
      type: object
    RegisterRequest:
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          description: 'At least 8 characters including letters and numbers; at most 72 UTF-8 bytes (bcrypt limit).'
          type: string
          format: password
          writeOnly: true
          maxLength: 72
          minLength: 8
        password_confirmation:
          type: string
          format: password
          writeOnly: true
      type: object
    LoginRequest:
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
      type: object
    LedgerEntry:
      required:
        - id
        - order_id
        - chain_sequence
        - type
        - direction
        - amount
        - currency
        - entry_hash
        - created_at
      properties:
        id:
          type: string
          example: 01J00000000000000000000000
        order_id:
          type: integer
        payment_id:
          type: integer
          nullable: true
        chain_sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - payment_initiated
            - payment_succeeded
            - payment_failed
            - payment_reversed
        direction:
          type: string
          enum:
            - credit
            - debit
            - memo
        amount:
          type: string
          example: '39.98'
        currency:
          type: string
          example: USD
        gateway:
          type: string
          nullable: true
        transaction_id:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        previous_hash:
          type: string
          nullable: true
        entry_hash:
          type: string
        created_at:
          type: string
          format: date-time
      type: object
    LedgerPage:
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
    OrderItem:
      required:
        - id
        - product_name
        - quantity
        - price
      properties:
        id:
          type: integer
          example: 1
        product_name:
          type: string
          example: Book
        quantity:
          type: integer
          example: 2
          minimum: 1
        price:
          type: string
          example: '19.99'
      type: object
    Order:
      required:
        - id
        - user_id
        - customer_name
        - customer_email
        - status
        - total_amount
        - items
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        customer_name:
          type: string
          example: 'Jane Doe'
        customer_email:
          type: string
          format: email
          example: jane@example.com
        status:
          type: string
          example: pending
          enum:
            - pending
            - confirmed
            - cancelled
        total_amount:
          type: string
          readOnly: true
          example: '39.98'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    OrderResponse:
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Order'
      type: object
    OrderPage:
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
    OrderItemInput:
      required:
        - product_name
        - quantity
        - price
      properties:
        product_name:
          type: string
          maxLength: 255
        quantity:
          type: integer
          maximum: 4294967295
          minimum: 1
        price:
          description: 'Non-negative decimal string; at most two decimal places and DECIMAL(12,2) capacity.'
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: '19.99'
      type: object
    CreateOrder:
      required:
        - customer_name
        - customer_email
        - items
      properties:
        customer_name:
          type: string
          maxLength: 255
        customer_email:
          type: string
          format: email
          maxLength: 255
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          maxItems: 1000
          minItems: 1
      type: object
    UpdateOrder:
      minProperties: 1
      properties:
        customer_name:
          type: string
          maxLength: 255
        customer_email:
          type: string
          format: email
          maxLength: 255
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          maxItems: 1000
          minItems: 1
      type: object
    Payment:
      required:
        - id
        - order_id
        - user_id
        - status
        - method
        - amount
        - currency
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - pending
            - successful
            - failed
        method:
          description: 'Enabled gateway name; extensible through configuration.'
          type: string
          example: credit_card
        amount:
          type: string
          example: '39.98'
        currency:
          type: string
          example: USD
        transaction_id:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    PaymentResponse:
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Payment'
      type: object
    PaymentPage:
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
    ProcessPayment:
      required:
        - method
        - payment_details
      properties:
        method:
          description: 'credit_card, paypal, or an enabled extension.'
          type: string
        payment_details:
          description: 'Validated dynamically by the selected gateway. Extensions define their own fields.'
          oneOf:
            -
              $ref: '#/components/schemas/CardDetails'
            -
              $ref: '#/components/schemas/PayPalDetails'
      type: object
    CardDetails:
      required:
        - card_number
        - expiry_month
        - expiry_year
        - cvv
        - card_holder
      properties:
        card_number:
          type: string
          pattern: '^[0-9]{13,19}$'
          example: '4242424242424242'
        expiry_month:
          type: integer
          example: 12
          maximum: 12
          minimum: 1
        expiry_year:
          type: integer
          example: 2030
          maximum: 9999
          minimum: 2000
        cvv:
          type: string
          pattern: '^[0-9]{3,4}$'
          example: '123'
        card_holder:
          type: string
          example: 'Jane Doe'
          maxLength: 255
      type: object
      additionalProperties: false
    PayPalDetails:
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: payer@example.com
          maxLength: 255
      type: object
      additionalProperties: false
    ErrorResponse:
      required:
        - message
        - code
      properties:
        message:
          type: string
          example: 'Authentication is required or the token is invalid.'
        code:
          type: string
          example: UNAUTHENTICATED
      type: object
    ValidationErrorResponse:
      allOf:
        -
          $ref: '#/components/schemas/ErrorResponse'
        -
          required:
            - errors
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          type: object
    PaginationLinks:
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
      type: object
    PaginationMeta:
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 1
      type: object
  responses:
    Unauthenticated:
      description: 'Authentication is missing or the token is invalid or expired.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthenticated:
              value:
                message: 'Authentication is required or the token is invalid.'
                code: UNAUTHENTICATED
    Forbidden:
      description: 'The authenticated user is not allowed to perform this action.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Forbidden:
              value:
                message: 'You are not allowed to perform this action.'
                code: FORBIDDEN
    NotFound:
      description: 'The resource does not exist or is not visible to this user.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NotFound:
              value:
                message: 'The requested resource was not found.'
                code: NOT_FOUND
    Conflict:
      description: 'The request conflicts with the resource state.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Conflict:
              value:
                message: 'The request conflicts with the current resource state.'
                code: CONFLICT
    ValidationError:
      description: 'Invalid input.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            ValidationError:
              value:
                message: 'The given data was invalid.'
                code: VALIDATION_ERROR
                errors:
                  email:
                    - 'The email field is required.'
    TooManyRequests:
      description: 'Rate limit exceeded. Retry after the indicated delay.'
      headers:
        Retry-After:
          description: 'Seconds before retrying.'
          schema:
            type: integer
            example: 60
        X-RateLimit-Limit:
          description: 'Allowed requests in this window.'
          schema:
            type: integer
            example: 5
        X-RateLimit-Remaining:
          description: 'Remaining requests.'
          schema:
            type: integer
            example: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            TooManyRequests:
              value:
                message: 'Too many requests. Please try again later.'
                code: TOO_MANY_REQUESTS
    ServerError:
      description: 'Unexpected error. Internal details are never exposed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ServerError:
              value:
                message: 'An unexpected error occurred.'
                code: SERVER_ERROR
  parameters:
    OrderId:
      name: order
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PaymentId:
      name: payment
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PaymentStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
          - pending
          - successful
          - failed
    PaymentMethodFilter:
      name: method
      in: query
      description: 'Historical gateway name; disabled methods may still be filtered.'
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 15
        maximum: 100
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Client-generated key, preferably a UUID, 8–255 characters. Completed identical requests replay status/body with Idempotent-Replayed: true; in-progress requests return 409 with Retry-After: 1; mismatches return 422. Default TTL 24 hours. Validation and server errors release the key.'
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 8
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: Authentication
    description: 'Register, log in, inspect the current user, and invalidate tokens.'
  -
    name: Orders
    description: 'Owner-scoped order management (introduced in Sprint 2).'
  -
    name: Payments
    description: 'Idempotent payment attempts (introduced in Sprint 4).'
  -
    name: Ledger
    description: 'Read-only financial history (introduced in Sprint 3).'
  -
    name: Documentation
    description: 'Interactive API reference, enabled outside production by default.'
