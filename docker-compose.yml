name: order-payment

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 60s

    nginx:
        image: nginx:1.28-alpine
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
            interval: 10s
            timeout: 5s
            retries: 5

    mysql:
        image: mysql:8.4
        command: ["--log-bin-trust-function-creators=1"]
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
            MYSQL_DATABASE: ${DB_DATABASE:-order_payment}
            MYSQL_USER: ${DB_USERNAME:-app}
            MYSQL_PASSWORD: ${DB_PASSWORD:-local-app-password}
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                - CMD-SHELL
                - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null 2>&1'
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    mysql_data:
    vendor:
